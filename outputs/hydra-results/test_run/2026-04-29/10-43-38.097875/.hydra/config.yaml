gpt_model:
  n_embd: 768
  n_layer: 12
  n_head: 12
  vocab_size: 50257
  flash_attention: true
optimizer_params:
  name: muon
  args:
    lr: 0.005
    weight_decay: 0
    ns_steps: 17
    polar_method: ''
lr_schedule:
  name: constant-linear
  warm_up_fraction: 0.4
logging_params:
  val_tokens_processed: 524288
  log_step: 50
  val_step: 50
  save_ckpt_step: 500
  load_ckpt_step: 0
  keep_last: 2
  save_checkpoint: false
  wandb:
    project: polar-express
training_data:
  training_params:
    tokens_processed: 2048
    batch_size: 2
    num_epochs: 1
    context_length: 512
    gradnorm: 1.0
    tensorcore_precision: high
    autocast: true
    mixed_precision: bfloat16
    compile: true
  dataset:
    name: tiny_shakespeare
