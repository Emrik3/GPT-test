hydra:
  run:
    dir: outputs/hydra-results/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S.%f}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.job.name=main_run
    - hydra.mode=RUN
    task:
    - +training_data=fineweb
    - gpt_model=gpt-small
    - optimizer_params.name=adamw
    - optimizer_params.args.lr=0.0001
    - optimizer_params.args.weight_decay=0.0
    - +logging_params.wandb.project=polar-express
  job:
    name: main_run
    chdir: null
    override_dirname: +logging_params.wandb.project=polar-express,+training_data=fineweb,gpt_model=gpt-small,optimizer_params.args.lr=0.0001,optimizer_params.args.weight_decay=0.0,optimizer_params.name=adamw
    id: ???
    num: ???
    config_name: test_hydra
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /cephyr/users/emrike/Alvis/GPT-test
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /cephyr/users/emrike/Alvis/GPT-test/hydra_conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /cephyr/users/emrike/Alvis/GPT-test/outputs/hydra-results/main_run/2026-05-13/23-28-44.282035
    choices:
      training_data: fineweb
      hydra: default
      gpt_model: gpt-small
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
