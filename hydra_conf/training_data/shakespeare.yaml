training_params:
  # tokens_processed must be divisible by (world size * batch size * token length)
  tokens_processed: 8192 # 2^13 — divisible by world_size*B*T for world_size∈{1,2,4,8}
  batch_size: 2
  num_epochs: 1
  context_length: 512
  gradnorm: 1.0
  tensorcore_precision: high   #Can be highest, high, or medium
  autocast: True
  mixed_precision: bfloat16
  compile: True

dataset:
  name: "tiny_shakespeare"  
